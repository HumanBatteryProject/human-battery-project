name = "hbp-brief"
main = "brief.js"
compatibility_date = "2026-09-01"

# Hourly, not daily. Members are in different timezones; /api/brief-run works
# out each member's own local date and morning_briefs_one_per_day makes the
# second write for a local day a no-op. So the Worker never needs to know what
# a timezone is.
[triggers]
# Hourly: the morning brief, which works out each member's own local date.
# Monday 13:00 UTC: the weekly trend pass, which had no caller and so had never
#   run. AUTONOMY_MODE is review_all, so everything it finds queues for approval.
# Daily 15:00 UTC: the cycle boundary, which asks /api/complete to close any
#   membership that has reached its ninetieth day in the member's own timezone.
# Daily 16:00 UTC: the billing run. Charges any installment due today in the
#   participant's own timezone. A charge it cannot attempt is recorded as blocked,
#   never as a payment failure: a vendor outage is not somebody failing to pay.
# Daily 11:00 UTC: the daily plan. Before the brief, because the brief reads it.
# Monday 12:00 UTC: the member facing weekly review, before the trend pass that
#   proposes changes, so a member reads what happened before anything is proposed.
crons = ["0 * * * *", "0 13 * * 1", "0 15 * * *", "0 16 * * *", "0 11 * * *", "0 12 * * 1"]

[vars]
SITE_ORIGIN = "https://thehumanbatteryproject.com"

# WEBHOOK_SECRET is the ONLY secret this Worker holds, and it is set with
#   wrangler secret put WEBHOOK_SECRET
# Workers do not see Pages environment variables, so this is deliberate and
# separate. Nothing else belongs here: see the header of brief.js.

# DEPLOYED 2026-09-25.
#   https://hbp-brief.micah-bc6.workers.dev
#   schedule 0 * * * *, version 7fcb2144-9bcb-4821-a473-4920ab36610e
# Proved on deploy: a firing wrote a real brief; a bad secret and a missing
# secret both returned 403; and two simultaneous firings produced exactly ONE
# row, one reporting written=1 and the other skipped_existing=1. The unique
# index morning_briefs_one_per_day is what made that true, not the worker.
