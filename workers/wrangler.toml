name = "hbp-brief"
main = "brief.js"
compatibility_date = "2026-09-01"

# Hourly, not daily. Members are in different timezones; /api/brief-run works
# out each member's own local date and morning_briefs_one_per_day makes the
# second write for a local day a no-op. So the Worker never needs to know what
# a timezone is.
[triggers]
# ONE trigger. Workers Free allows five cron triggers per ACCOUNT, and this
# account has others, so asking for a sixth failed with code 10072 and left the
# code deployed with no trigger, which is worse than either outcome.
#
# The hourly firing now decides what else is due, in brief.js. That also puts the
# whole schedule in one readable place rather than splitting it between this file
# and a lookup table that had to agree with it.
crons = ["0 * * * *"]

[vars]
SITE_ORIGIN = "https://thehumanbatteryproject.com"

# WEBHOOK_SECRET is the ONLY secret this Worker holds, and it is set with
#   wrangler secret put WEBHOOK_SECRET
# Workers do not see Pages environment variables, so this is deliberate and
# separate. Nothing else belongs here: see the header of brief.js.

# DEPLOYED 2026-09-25.
#   https://hbp-brief.micah-bc6.workers.dev
#   schedule 0 * * * *, version 7fcb2144-9bcb-4821-a473-4920ab36610e
# Proved on deploy: a firing wrote a real brief; a bad secret and a missing
# secret both returned 403; and two simultaneous firings produced exactly ONE
# row, one reporting written=1 and the other skipped_existing=1. The unique
# index morning_briefs_one_per_day is what made that true, not the worker.
