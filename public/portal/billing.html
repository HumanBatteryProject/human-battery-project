<link rel="icon" href="/assets/mark-32.png" type="image/png" sizes="32x32">

</head><body>

<header class="bar"><div class="wrap">
  <img src="/assets/wordmark.png" alt="The Human Battery Project">
  <span class="who">BILLING</span>
</div></header>

<main class="wrap">
  <div id="loading" class="card center"><span class="spinner"></span></div>

  <div id="body" style="display:none">

    <section class="card" id="program-card" style="display:none">
      <h2>Your 90 day program</h2>
      <p id="program-line" class="quiet"></p>
    </section>

    <section class="card" id="owed-card" style="display:none">
      <h2>What is owed</h2>
      <div id="owed"></div>
    </section>

    <section class="card" id="membership-card" style="display:none">
      <h2>Your membership</h2>
      <div id="membership"></div>
      <div id="membership-actions"></div>
    </section>

    <section class="card" id="options-card" style="display:none">
      <h2>Continuing after day 90</h2>
      <p class="quiet" id="options-intro"></p>
      <div id="options"></div>
    </section>

    <section class="card" id="consent-card" style="display:none">
      <h2 id="consent-title">Before you subscribe</h2>
      <div id="consent-body" class="quiet"></div>
      <label class="row"><input type="checkbox" id="consent-agree">
        <span>I have read this and I agree to a recurring payment.</span></label>
      <button class="btn btn-sm" id="consent-save" disabled>Agree and continue</button>
    </section>

    <section class="card">
      <h2>Your records are yours</h2>
      <p class="quiet" id="rights"></p>
      <p><a href="/portal/account">Export or delete your records</a></p>
    </section>

  </div>
</main>

<nav class="nav"><ul>
  <li><a href="/portal/"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a></li>
    <li><a href="/portal/checkin.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</a></li>
  <li><a href="/portal/log.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 3v3M16 3v3M8 12h8M8 16h5"/></svg>Log</a></li>
  <li><a href="/portal/program.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6M9 13h7M9 17h5"/></svg>Program</a></li>
  <li><a href="/portal/calls.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Calls</a></li>
  <li><a href="/portal/seasonal.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21c0-7 4-11 9-12-1 7-4 11-9 12z"/><path d="M12 21c0-5-3-8-7-9 1 5 3 8 7 9z"/></svg>Season</a></li>
  <li><a href="/portal/labs.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20h16M7 20V9M12 20V4M17 20v-7"/></svg>Results</a></li>
  <li><a href="/portal/account.html" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>You</a></li>
</ul></nav>

<script type="module">
import { sb, requireAuth, el, toast } from './app.js?v=3c1c951d';

await requireAuth();

const money = (c) => c == null ? null : '$' + (c / 100).toFixed(2);
// Dates are shown as the date the member is told, never reformatted into
// something a timezone could shift by a day.
const say = (d) => d ? new Date(d + 'T12:00:00Z').toLocaleDateString('en-US',
  { year: 'numeric', month: 'long', day: 'numeric' }) : '';

async function token() {
  const { data } = await sb.auth.getSession();
  return data.session ? data.session.access_token : null;
}

async function load() {
  const t = await token();
  const res = await fetch('/api/membership', { headers: { Authorization: 'Bearer ' + t } });
  if (!res.ok) { toast('Could not load your billing.'); return null; }
  return res.json();
}

async function act(payload) {
  const t = await token();
  const res = await fetch('/api/membership', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
    body: JSON.stringify(payload),
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) { toast(out.error || 'That did not work.'); return null; }
  return out;
}

function render(s) {
  el('#rights').textContent = s.account_rights.statement;

  if (s.program) {
    el('#program-card').style.display = '';
    const left = s.program.days_left;
    el('#program-line').textContent = s.program.ends_on
      ? (left > 0
          ? 'Your program runs to ' + say(s.program.ends_on) + ', which is ' + left + ' days from today.'
          : 'Your program finished on ' + say(s.program.ends_on) + '.')
      : 'Your program has no end date recorded yet.';
  }

  // The membership they hold.
  if (s.membership) {
    const m = s.membership;
    el('#membership-card').style.display = '';
    const lines = [];
    lines.push('<p><strong>' + m.label + '</strong>' +
      (m.amount ? ', ' + m.amount + ' every ' + m.every : '') + '</p>');
    if (m.status === 'suspended') {
      lines.push('<p class="held-msg">Your membership is on hold: ' +
        (m.suspended_reason || 'a payment did not go through') +
        '. Nothing has been deleted.</p>');
    } else if (m.cancel_at_period_end) {
      lines.push('<p class="held-msg">Cancelled. You keep everything until ' +
        say(m.access_until) + ', and you will not be charged again.</p>');
    } else if (m.renews_on) {
      lines.push('<p>Started ' + say(m.started_on) + '. Renews ' + say(m.renews_on) + '.</p>');
    }
    el('#membership').innerHTML = lines.join('');

    const actions = [];
    if (m.cancel_at_period_end) {
      actions.push('<button class="btn btn-sm" id="resume">Keep my membership</button>');
    } else if (m.status === 'active') {
      actions.push('<button class="btn btn-sm" id="cancel">Cancel membership</button>');
    }
    el('#membership-actions').innerHTML = actions.join(' ');

    const c = el('#cancel');
    if (c) c.addEventListener('click', async () => {
      const out = await act({ action: 'cancel' });
      if (out) { toast(out.statement || 'Cancelled.'); boot(); }
    });
    const r = el('#resume');
    if (r) r.addEventListener('click', async () => {
      const out = await act({ action: 'resume' });
      if (out) { toast('Your membership will continue.'); boot(); }
    });
  }

  // The options they could buy.
  const buyable = s.options.filter((o) => o.available && o.amount_cents);
  if (buyable.length) {
    el('#options-card').style.display = '';
    el('#options-intro').textContent = s.membership
      ? 'You can move to the other option. You will never hold both at once and you will never be billed twice for the same period.'
      : 'Your ninety day program ends. Continuing is optional, and nothing renews unless you choose it.';

    el('#options').innerHTML = buyable.map((o) => `
      <div class="dim">
        <div class="dim-head"><strong>${o.label}</strong>
          <span class="unit">${o.amount} every ${o.every}</span></div>
        <p class="quiet">${o.statement || ''} It renews ${say(o.renews_on)}. You can cancel at any time.</p>
        <button class="btn btn-sm buy" data-kind="${o.kind}"
          ${s.consent.granted ? '' : 'disabled'}>Choose ${o.label.toLowerCase()}</button>
      </div>`).join('');

    if (!s.consent.granted) {
      el('#consent-card').style.display = '';
      el('#consent-title').textContent = s.consent.title || 'Before you subscribe';
      el('#consent-body').textContent = s.consent.body || '';
      el('#consent-agree').addEventListener('change', (e) => {
        el('#consent-save').disabled = !e.target.checked;
      });
      el('#consent-save').addEventListener('click', async () => {
        const out = await act({ action: 'consent' });
        if (out) { toast('Thank you. You can choose an option now.'); boot(); }
      });
    }

    for (const b of document.querySelectorAll('.buy')) {
      b.addEventListener('click', async () => {
        b.disabled = true;
        const res = await fetch('/api/checkout', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan: b.dataset.kind, email: s.email || undefined }),
        });
        const out = await res.json().catch(() => ({}));
        if (out.url) { location.href = out.url; return; }
        b.disabled = false;
        // The unconfigured case says what is missing rather than blaming the member.
        toast(out.why || out.error || 'Checkout is not available yet.');
      });
    }
  }
}

async function boot() {
  const s = await load();
  if (!s) { el('#loading').style.display = 'none'; return; }
  // The email the checkout call needs, read from the session rather than typed.
  const { data } = await sb.auth.getUser();
  s.email = data && data.user ? data.user.email : null;
  render(s);
  el('#loading').style.display = 'none';
  el('#body').style.display = 'block';
}

boot();
</script>
</body></html>
