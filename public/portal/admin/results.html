<!DOCTYPE html><html lang="en"><head>
<title>Check self-entered results | The Human Battery Project</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/mark-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/mark-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/mark-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1424">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Newsreader:opsz,wght@6..72,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal/portal.css?v=16">
</head><body>

<header class="bar"><div class="wrap">
  <img src="/assets/wordmark.png" alt="The Human Battery Project">
  <span class="who">STAFF</span>
</div></header>

<main class="wrap">
  <div id="loading" class="card center"><span class="spinner"></span></div>

  <div id="denied" class="card" style="display:none">
    <h2>Not for you</h2>
    <p class="quiet">This screen is for staff. <a href="/portal/">Back to your dashboard</a>.</p>
  </div>

  <div id="clear" class="card" style="display:none">
    <h2>Nothing waiting</h2>
    <p class="quiet">Every self-entered result has been checked against its report.</p>
  </div>

  <div id="held" style="display:none"></div>
  <div id="body" style="display:none"></div>
</main>

<script type="module">
import { sb, requireAuth, el, toast } from '../app.js';
await requireAuth();

// The point of this screen is one comparison: the number the client typed
// against the number on the report they uploaded. Everything else is
// arrangement.
const { data: me } = await sb.from('profiles').select('role').limit(1).single();
// Mirrors is_staff() in 002_identity.sql. app_role is client, coach, admin.
if (!me || !['admin', 'coach'].includes(me.role)) {
  el('#loading').style.display = 'none';
  el('#denied').style.display = 'block';
} else {
  await renderHeld();
  const { data: rows, error } = await sb.from('lab_results')
    .select('id, value, unit, created_at, lab_markers(name, slug, plausible_low, plausible_high, optimal_low, optimal_high), lab_panels(id, draw_point, drawn_on, document_path, profiles!lab_panels_client_id_fkey(full_name, email))')
    .eq('source', 'client_entered')
    .is('verified_at', null)
    .order('created_at', { ascending: true });

  el('#loading').style.display = 'none';

  if (error) {
    el('#body').innerHTML = '<div class="card"><h2>That did not load</h2><p class="quiet">' + error.message + '</p></div>';
    el('#body').style.display = 'block';
  } else if (!rows || !rows.length) {
    el('#clear').style.display = 'block';
  } else {
    // Group by panel so one upload is opened once, not once per marker.
    const panels = new Map();
    rows.forEach((r) => {
      const key = r.lab_panels.id;
      if (!panels.has(key)) panels.set(key, { panel: r.lab_panels, results: [] });
      panels.get(key).results.push(r);
    });

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let html = '<div class="card"><h2>' + rows.length + ' to check</h2>' +
      '<p class="tiny" style="margin:0">Open the report, compare the number, mark it checked. ' +
      'Marking it checked does not change the value. If the number is wrong, fix it in the database ' +
      'and leave a note, because overwriting it here would hide that a client typed something else.</p></div>';

    panels.forEach(({ panel, results }) => {
      html += '<section class="card" data-panel="' + esc(panel.id) + '">' +
        '<h2>' + esc(panel.profiles ? panel.profiles.full_name : 'Unknown') + '</h2>' +
        '<p class="tiny" style="margin:-.5rem 0 .8rem">' + esc(panel.profiles ? panel.profiles.email : '') +
        ' &middot; ' + esc(panel.draw_point.replace('_', ' ')) + ' &middot; collected ' + esc(panel.drawn_on) + '</p>' +
        '<p><a class="btn btn-sm" href="#" data-doc="' + esc(panel.document_path || '') + '">Open the report</a></p>' +
        '<table><tbody>';
      results.forEach((r) => {
        const m = r.lab_markers || {};
        const band = (m.optimal_low != null && m.optimal_high != null)
          ? '<div class="tiny">target ' + m.optimal_low + ' to ' + m.optimal_high + '</div>' : '';
        html += '<tr data-result="' + esc(r.id) + '">' +
          '<td>' + esc(m.name) + band + '</td>' +
          '<td class="num">' + esc(r.value) + ' <span class="tiny">' + esc(r.unit) + '</span></td>' +
          '<td class="num"><button class="btn btn-sm" data-verify="' + esc(r.id) + '">Matches</button></td>' +
          '</tr>';
      });
      html += '</tbody></table></section>';
    });

    el('#body').innerHTML = html;
    el('#body').style.display = 'block';

    // Signed on demand rather than up front. A page full of live links to
    // client medical documents is not a page anyone should leave open.
    el('#body').addEventListener('click', async (e) => {
      const link = e.target.closest('[data-doc]');
      if (link) {
        e.preventDefault();
        const path = link.getAttribute('data-doc');
        if (!path) return toast('No document on this panel', 'err');
        const { data, error: se } = await sb.storage.from('client-uploads').createSignedUrl(path, 300);
        if (se || !data) return toast('Could not open that document', 'err');
        window.open(data.signedUrl, '_blank', 'noopener');
        return;
      }

      const btn = e.target.closest('[data-verify]');
      if (!btn) return;
      btn.disabled = true;
      const { data, error: ve } = await sb.rpc('verify_client_result', { p_result_id: btn.getAttribute('data-verify'), p_ok: true });
      if (ve || !data || !data.ok) {
        btn.disabled = false;
        return toast((data && data.message) || 'That did not save', 'err');
      }
      btn.textContent = 'Checked';
      toast('Marked as checked');
    });
  }
}

// ---------------------------------------------------------------------
// Held results
//
// A held row is a result the analysis agent REFUSED to score: an unrecognized
// marker name, no unit, a unit it cannot convert, or a value that is not a
// number. Holding is correct. What was missing until now is any way to see
// them, so two rows sat invisible. Each one gets the reason in words and the
// three things a person can actually decide: what marker it is, what unit it
// is in, or that it was never a result.
// ---------------------------------------------------------------------
async function renderHeld() {
  const escH = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const { data: held, error: he } = await sb.from('lab_results_held')
    .select('id, reported_name, reported_value, reported_unit, reason, held_at, lab_panels(drawn_on), profiles!lab_results_held_client_id_fkey(full_name, email)')
    .is('resolved_at', null)
    .order('held_at', { ascending: true });

  if (he) {
    el('#held').innerHTML = '<div class="card"><h2>Held results did not load</h2><p class="quiet">' +
      escH(he.message) + '</p></div>';
    el('#held').style.display = 'block';
    return;
  }
  if (!held || !held.length) return;   // nothing held is the normal state

  const { data: markers } = await sb.from('lab_markers')
    .select('id, name, slug, unit').eq('is_active', true).order('name');

  // The reason is stored as a code. A person reading this screen needs the
  // sentence, and needs to be told what to do about it.
  const REASON = {
    unknown_marker: ['No marker by that name', 'Nothing in the marker list matches what the report called this. Pick the marker it is, or discard it.'],
    missing_unit: ['No unit given', 'The value arrived with no unit, and assuming one is the most dangerous guess available. Type the unit from the report.'],
    unconvertible_unit: ['Unit cannot be converted', 'There is no conversion from that unit to this marker\'s canonical unit. Check the report, or discard it.'],
    implausible_value: ['Not a number', 'The value could not be read as a number at all.'],
  };

  const opts = (markers || []).map((m) =>
    '<option value="' + escH(m.id) + '" data-unit="' + escH(m.unit) + '">' +
    escH(m.name) + ' (' + escH(m.unit) + ')</option>').join('');

  let h = '<div class="card"><h2>' + held.length + ' held, not scored</h2>' +
    '<p class="tiny" style="margin:0">These did not enter anyone\'s Score. They are not missing and they are not zero: ' +
    'they are values nothing could safely read. Resolving one writes a real result. Discarding one records that ' +
    'a person looked and decided it was not a result.</p></div>';

  held.forEach((r) => {
    const [title, what] = REASON[r.reason] || [r.reason, ''];
    h += '<section class="card" data-held="' + escH(r.id) + '">' +
      '<h2>' + escH(r.reported_name) + '</h2>' +
      '<p class="tiny" style="margin:-.5rem 0 .8rem">' +
      escH(r.profiles ? (r.profiles.full_name || r.profiles.email) : 'Unknown person') +
      (r.lab_panels && r.lab_panels.drawn_on ? ' &middot; collected ' + escH(r.lab_panels.drawn_on) : '') +
      ' &middot; held ' + escH(String(r.held_at).slice(0, 10)) + '</p>' +
      '<p><b>' + escH(title) + '.</b> <span class="quiet">' + escH(what) + '</span></p>' +
      '<p>Reported as <b>' + escH(r.reported_value) + '</b> ' +
      (r.reported_unit ? escH(r.reported_unit) : '<span class="quiet">with no unit</span>') + '</p>' +
      '<div class="held-fix">' +
        '<label class="tiny">Which marker<select data-marker><option value="">Pick one</option>' + opts + '</select></label>' +
        '<label class="tiny">Unit<input data-unit type="text" value="' + escH(r.reported_unit || '') + '" placeholder="as printed"></label>' +
      '</div>' +
      '<p><button class="btn btn-sm" data-map="' + escH(r.id) + '">Save as a result</button> ' +
      '<button class="btn btn-sm" data-discard="' + escH(r.id) + '">Not a result</button></p>' +
      '<p class="tiny held-msg" style="display:none"></p>' +
      '</section>';
  });

  el('#held').innerHTML = h;
  el('#held').style.display = 'block';

  // Picking a marker fills the unit with that marker's canonical one ONLY when
  // the field is empty. Overwriting a unit the report actually printed would
  // convert from a unit the value was never in.
  el('#held').addEventListener('change', (e) => {
    const sel = e.target.closest('[data-marker]');
    if (!sel) return;
    const card = sel.closest('[data-held]');
    const unitBox = card.querySelector('[data-unit]');
    const opt = sel.options[sel.selectedIndex];
    if (!unitBox.value.trim() && opt && opt.getAttribute('data-unit')) {
      unitBox.value = opt.getAttribute('data-unit');
    }
  });

  el('#held').addEventListener('click', async (e) => {
    const mapBtn = e.target.closest('[data-map]');
    const delBtn = e.target.closest('[data-discard]');
    if (!mapBtn && !delBtn) return;
    const card = (mapBtn || delBtn).closest('[data-held]');
    const msg = card.querySelector('.held-msg');
    const heldId = card.getAttribute('data-held');

    if (delBtn && !window.confirm('Record that this was not a result? It stops being held and never enters a Score.')) return;

    const payload = delBtn
      ? { held_id: heldId, action: 'discard' }
      : { held_id: heldId, action: 'map',
          marker_id: card.querySelector('[data-marker]').value,
          unit: card.querySelector('[data-unit]').value.trim() };

    (mapBtn || delBtn).disabled = true;
    const { data: { session: s } } = await sb.auth.getSession();
    let out;
    try {
      const res = await fetch('/api/resolve-held', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token },
        body: JSON.stringify(payload),
      });
      out = await res.json();
    } catch (err) {
      out = { error: 'That did not reach the server. Try again.' };
    }

    if (!out || out.error) {
      (mapBtn || delBtn).disabled = false;
      msg.style.display = 'block';
      msg.textContent = (out && out.error) || 'That did not save';
      return toast((out && out.error) || 'That did not save', 'err');
    }
    card.querySelectorAll('button, select, input').forEach((n) => { n.disabled = true; });
    msg.style.display = 'block';
    msg.textContent = out.action === 'discard'
      ? 'Recorded as not a result.'
      : 'Saved as ' + out.marker + ': ' + out.value + ' ' + out.unit +
        (out.conversion ? ' (' + out.conversion + ')' : '');
    toast(out.action === 'discard' ? 'Recorded' : 'Saved as a result');
  });
}
</script>
</body></html>
